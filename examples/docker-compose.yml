name: sqlc-pgx-monitoring

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: complex-password
      POSTGRES_DB: example_db
    volumes:
      - ./db/migrations/001_schema.up.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d example_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  lgtm:
    image: grafana/otel-lgtm:0.34.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./grafana/provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/sqlc-pgx-monitoring.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/dashboards:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 2s
      retries: 60

  workload:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    environment:
      DATABASE_URL: postgres://example:complex-password@postgres:5432/example_db?sslmode=disable
      OTEL_SERVICE_NAME: sqlc-pgx-monitoring-example
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    restart: unless-stopped
