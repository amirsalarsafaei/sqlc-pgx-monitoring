version: "2"
sql:
  - schema: "./db/migrations"
    queries: "./db/queries"
    engine: "postgresql"
    gen:
      go:
        package: "store"
        out: "./db/store"
        emit_interface: true
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        query_parameter_limit: 5
        sql_package: "pgx/v5"
