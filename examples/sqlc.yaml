version: "2"
sql:
  - schema: "./db/migrations"
    queries: "./db/entities/exampletable/queries"
    engine: "postgresql"
    gen:
      go:
        out: "./db/entities/exampletable"
        emit_interface: true
        emit_json_tags: true
        emit_db_tags: true
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        sql_package: "pgx/v5"
  - schema: "./db/migrations"
    queries: "./db/entities/integration_test/queries"
    engine: "postgresql"
    gen:
      go:
        out: "./db/entities/integration_test"
        emit_interface: true
        emit_json_tags: true
        emit_db_tags: true
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        query_parameter_limit: 5
        sql_package: "pgx/v5"
